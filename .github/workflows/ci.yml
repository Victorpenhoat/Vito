name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "npm" }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # VERSION ÉPINGLÉE, NE PAS REMETTRE `latest`. Avec `latest`, l'action
          # résout la version par un appel à l'API GitHub — appel non
          # authentifié, donc soumis au quota partagé des runners. Mesuré en
          # conditions réelles sur la PR #208 : « Failed to resolve latest
          # Supabase CLI release: rate limit exceeded », job `quality` rouge en
          # 32 s sur un faux motif, à relancer à la main. Une version exacte se
          # télécharge sans cet appel. À remonter délibérément, pas par défaut.
          version: 2.117.0
      - run: supabase start
      - run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "DOCUMENTS_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: RLS (pgTAP)
        run: supabase test db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report (traces + screenshots)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Second garde-fou, indépendant du premier : il ne rejoue ni les tests ni le
  # build, il regarde ce que le code TRAÎNE — du mort, une fuite, une faille
  # connue. Séparé de `quality` pour que son échec se lise d'un coup d'œil, et
  # pour qu'il tourne en parallèle sans allonger le chemin critique.
  securite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scanne l'HISTORIQUE : sans profondeur complète, il ne
          # verrait que le dernier commit et ne prouverait rien.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "npm" }
      - run: npm ci
      - name: Code mort et dépendances inutilisées (knip)
        run: npm run knip
      - name: Failles connues, arbre de production uniquement
        # Les dépendances de développement (Capacitor CLI, Storybook) ne sont
        # pas servies aux utilisateurs : les inclure rendrait ce garde-fou
        # rouge en permanence, donc illisible.
        run: npm run audit:prod
      - name: Secrets dans l'historique (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner

  # Troisième garde-fou : la production a-t-elle bien reçu les migrations de
  # `main` ? Rien ne les pousse automatiquement, donc une PR qui en contient
  # une part en production AVANT sa table — le limiteur de débit a tourné 2 h
  # sans `consommer_quota` le 9 septembre, la fiche d'un proche a été cassée
  # sans sa colonne le 13. Les deux fois, personne ne l'a su avant qu'une page
  # ne casse.
  #
  # Ne tourne qu'après une fusion sur `main` : il ne bloque donc aucune PR, il
  # allume un voyant. Et il reste INERTE tant que les identifiants ne sont pas
  # configurés — il annonce alors ce qu'il lui manque, plutôt que de passer au
  # vert en donnant l'illusion d'une vérification.
  prod-a-jour:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Comparer les migrations de main à celles de la production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$REF" ]; then
            echo "::notice title=Garde-fou inactif::Ce contrôle ne peut pas interroger la production."
            echo "Pour l'activer : secrets SUPABASE_ACCESS_TOKEN et SUPABASE_DB_PASSWORD,"
            echo "variable SUPABASE_PROJECT_REF (Settings → Secrets and variables → Actions)."
            exit 0
          fi
          supabase link --project-ref "$REF"
          node scripts/prod-ecart.mjs
