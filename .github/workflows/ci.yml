name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "npm" }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # VERSION ÉPINGLÉE, NE PAS REMETTRE `latest`. Avec `latest`, l'action
          # résout la version par un appel à l'API GitHub — appel non
          # authentifié, donc soumis au quota partagé des runners. Mesuré en
          # conditions réelles sur la PR #208 : « Failed to resolve latest
          # Supabase CLI release: rate limit exceeded », job `quality` rouge en
          # 32 s sur un faux motif, à relancer à la main. Une version exacte se
          # télécharge sans cet appel. À remonter délibérément, pas par défaut.
          version: 2.117.0
      - run: supabase start
      - run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "DOCUMENTS_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: RLS (pgTAP)
        run: supabase test db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report (traces + screenshots)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Second garde-fou, indépendant du premier : il ne rejoue ni les tests ni le
  # build, il regarde ce que le code TRAÎNE — du mort, une fuite, une faille
  # connue. Séparé de `quality` pour que son échec se lise d'un coup d'œil, et
  # pour qu'il tourne en parallèle sans allonger le chemin critique.
  securite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scanne l'HISTORIQUE : sans profondeur complète, il ne
          # verrait que le dernier commit et ne prouverait rien.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "npm" }
      - run: npm ci
      - name: Code mort et dépendances inutilisées (knip)
        run: npm run knip
      - name: Failles connues, arbre de production uniquement
        # Les dépendances de développement (Capacitor CLI, Storybook) ne sont
        # pas servies aux utilisateurs : les inclure rendrait ce garde-fou
        # rouge en permanence, donc illisible.
        run: npm run audit:prod
      - name: Secrets dans l'historique (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner

  # Troisième garde-fou : la production a-t-elle bien reçu les migrations de
  # `main` ? Rien ne les pousse automatiquement, donc une PR qui en contient
  # une part en production AVANT sa table — le limiteur de débit a tourné 2 h
  # sans `consommer_quota` le 9 septembre, la fiche d'un proche a été cassée
  # sans sa colonne le 13. Les deux fois, personne ne l'a su avant qu'une page
  # ne casse.
  #
  # Ne tourne qu'après une fusion sur `main` : il ne bloque donc aucune PR, il
  # allume un voyant. Et il reste INERTE tant que les identifiants ne sont pas
  # configurés — il annonce alors ce qu'il lui manque, plutôt que de passer au
  # vert en donnant l'illusion d'une vérification.
  prod-a-jour:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: supabase/setup-cli@v1
        with:
          # Épinglée pour la même raison que le job `quality` ci-dessus : `latest`
          # se résout par un appel non authentifié à l'API GitHub, soumis au quota
          # partagé des runners, et rougit le job sur un faux motif.
          version: 2.117.0
      - name: Comparer les migrations de main à celles de la production
        env:
          # Chaîne de connexion complète : le contrôle parle à la BASE, et à
          # rien d'autre. Le premier jet passait par `supabase link`, donc par
          # l'API de gestion, donc par les droits du compte — mesuré le
          # 2026-09-14 : « Your account does not have the necessary privileges
          # to access this endpoint », pour lire une table de migrations. Une
          # vérification qui dépend de privilèges dont elle n'a pas besoin
          # tombe un jour pour une raison hors sujet.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice title=Garde-fou inactif::Ce contrôle ne peut pas interroger la production."
            echo "Pour l'activer : secret SUPABASE_DB_URL (Settings → Secrets and variables → Actions),"
            echo "de la forme postgresql://postgres.<ref>:<mot de passe>@<hôte-pooler>:5432/postgres"
            exit 0
          fi
          node scripts/prod-ecart.mjs

  # Le jumeau du précédent, pour ce qui ne vit PAS dans le dépôt : la configuration
  # d'auth des projets distants. Le 14 septembre on a découvert que le hook
  # `custom_access_token` était désactivé en prod ET en staging, vraisemblablement
  # depuis toujours — donc que is_agence(), is_concierge() et is_admin() rendaient
  # false pour tout le monde, et que les comptes agence et admin n'avaient aucun
  # droit en production. Les 251 assertions du filet RLS ne pouvaient rien y faire :
  # elles éprouvent le code, et c'est la configuration qui manquait.
  #
  # Ne se connecte pas à la base — `config diff` interroge l'API de management —
  # donc pas de SUPABASE_DB_PASSWORD ni de `link` ici.
  config-conforme:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: supabase/setup-cli@v1
        with:
          # `config diff` n'existe qu'à partir de la 2.117.0 ; une CLI plus ancienne
          # rend son AIDE avec un statut non nul, que le script sait reconnaître.
          version: 2.117.0
      - name: Comparer la configuration d'auth du dépôt à celle des projets distants
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF_PROD: ${{ vars.SUPABASE_PROJECT_REF }}
          REF_STAGING: ${{ vars.SUPABASE_STAGING_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF_PROD" ]; then
            echo "::notice title=Garde-fou inactif::Ce contrôle ne peut pas interroger la configuration distante."
            echo "Pour l'activer : secret SUPABASE_ACCESS_TOKEN et variable SUPABASE_PROJECT_REF"
            echo "(+ SUPABASE_STAGING_REF pour couvrir aussi le staging)."
            exit 0
          fi
          # Les deux projets sont interrogés même si le premier dérive : savoir que
          # la prod ET le staging ont le même trou vaut mieux que de l'apprendre en
          # deux fois. D'où l'agrégation plutôt qu'un `&&`.
          #
          # ET ON GARDE LES TROIS ISSUES DU SCRIPT DISTINCTES — 0 conforme,
          # 1 dérive, 2 « je n'ai pas pu demander ». Une première version écrasait
          # les deux dernières avec `|| echec=1`, et le premier run réel l'a
          # aussitôt puni : un jeton sans droits (« Your account does not have the
          # necessary privileges ») s'affichait comme une dérive de configuration,
          # envoyant chercher un réglage distant qui n'avait pas bougé. Le job
          # rougit dans les deux cas — le silence serait pire — mais il doit dire
          # LEQUEL, sinon il fait perdre le temps qu'il prétend faire gagner.
          derive=0
          muet=0
          verifier() {
            node scripts/config-derive.mjs "$1"
            case $? in
              0) ;;
              2) muet=1 ;;
              *) derive=1 ;;
            esac
          }
          verifier "$REF_PROD"
          if [ -n "$REF_STAGING" ]; then
            verifier "$REF_STAGING"
          else
            echo "::notice title=Staging non couvert::Définir SUPABASE_STAGING_REF pour l'inclure."
          fi
          if [ "$muet" = 1 ]; then
            echo "::error title=Question non posée::Le contrôle n'a PAS pu interroger la configuration distante — ce n'est pas une dérive. Cause la plus fréquente : le jeton SUPABASE_ACCESS_TOKEN n'a pas les droits sur le projet (Account → Access Tokens, puis Settings → Secrets → Actions)."
          fi
          if [ "$derive" = 1 ]; then
            echo "::error title=Dérive de configuration::Un réglage d'auth surveillé diverge entre le dépôt et un projet distant. Détail ci-dessus."
          fi
          [ "$muet" = 0 ] && [ "$derive" = 0 ]
